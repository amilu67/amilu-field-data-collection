<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Amilu Field Data Collection — {{SITE_NAME}}</title>

    <link rel="manifest" href="{{HOME_URL}}mfdc-app/manifest.json">
    <link rel="icon" type="image/svg+xml" href="{{PLUGIN_URL}}pwa/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="{{PLUGIN_URL}}pwa/icons/icon-192.svg">

    <!-- Font Awesome 6 (bundled locally) -->
    <link rel="stylesheet" href="{{PLUGIN_URL}}assets/vendor/fontawesome/all.min.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="{{PLUGIN_URL}}pwa/css/app.css">
</head>
<body data-rest-url="{{REST_URL}}">

<div id="app">
    <!-- Top Bar -->
    <div class="topbar">
        <button class="topbar-back" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
        <span class="topbar-title">Amilu Field Data Collection</span>
        <span class="topbar-status online" title="Online"></span>
    </div>

    <!-- Sync Banner -->
    <div class="sync-banner">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Entries pending upload</span>
        <span class="sync-count">0 pending</span>
    </div>

    <!-- Main Content -->
    <div class="main"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="active" data-view="projects">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Projects</span>
        </button>
        <button data-view="entries-list">
            <i class="fa-solid fa-database"></i>
            <span>Entries</span>
        </button>
        <button data-view="settings">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </button>
    </nav>
</div>

<!-- html5-qrcode for barcode/QR scanning (bundled locally) -->
<script src="{{PLUGIN_URL}}assets/vendor/html5-qrcode/html5-qrcode.min.js"></script>

<!-- App Scripts (order matters: db → form-renderer → sync → app) -->
<script src="{{PLUGIN_URL}}pwa/js/db.js"></script>
<script src="{{PLUGIN_URL}}pwa/js/form-renderer.js"></script>
<script src="{{PLUGIN_URL}}pwa/js/sync.js"></script>
<script src="{{PLUGIN_URL}}pwa/js/app.js"></script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('{{HOME_URL}}mfdc-app/sw.js', { scope: '{{HOME_URL}}' })
        .then(reg => console.log('SW registered', reg.scope))
        .catch(err => console.warn('SW registration failed', err));
}
</script>

</body>
</html>
